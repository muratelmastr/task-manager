<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ekip Görev Takibi</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%85%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-logo" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></symbol>
    <symbol id="i-board" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 7v8M12 7v4M16 7v10"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
    <symbol id="i-sheet" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 3v18"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 21V9M7 14l5-5 5 5M5 3h14"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13M9 7V4h6v3"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
    <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
    <symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="M12 5v14M19 12l-7 7-7-7"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></symbol>
    <symbol id="i-sort" viewBox="0 0 24 24"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M3 13h5l1 3h6l1-3h5"/><path d="M5.5 5h13L21 13v6H3v-6z"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 6.1A9.8 9.8 0 0 1 12 6c5 0 9 6 9 6a17 17 0 0 1-2.6 3.3M6.6 6.6C4.3 8.1 3 12 3 12s4 6 9 6a9 9 0 0 0 4.4-1.1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></symbol>
  </svg>

  <header class="app-header" id="app-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><svg class="icon"><use href="#i-logo"/></svg></span>
        <h1>Ekip Görev Takibi</h1>
      </div>
      <div class="view-toggle" role="group" aria-label="Görünüm">
        <button type="button" class="view-btn" data-view="list" aria-pressed="true"><svg class="icon" aria-hidden="true"><use href="#i-list"/></svg><span>Liste</span></button>
        <button type="button" class="view-btn" data-view="board" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-board"/></svg><span>Board</span></button>
      </div>
      <div class="header-actions">
        <div id="cloud-bar" class="cloud-bar" hidden>
          <span id="cloud-status" class="cloud-status" role="status"></span>
        </div>
        <div class="menu" id="data-menu">
          <button type="button" id="btn-data-menu" class="btn btn-ghost" aria-haspopup="menu" aria-expanded="false" aria-controls="data-menu-list" title="Dışa aktar / yedekten yükle">
            <svg class="icon" aria-hidden="true"><use href="#i-database"/></svg><span class="btn-label">Veri</span><svg class="icon icon-sm menu-chevron" aria-hidden="true"><use href="#i-chevron-down"/></svg>
          </button>
          <div id="data-menu-list" class="menu-list" role="menu" aria-labelledby="btn-data-menu" hidden>
            <button type="button" role="menuitem" id="btn-export-xlsx" class="menu-item" tabindex="-1"><svg class="icon" aria-hidden="true"><use href="#i-sheet"/></svg>Excel'e Aktar</button>
            <button type="button" role="menuitem" id="btn-export-json" class="menu-item" tabindex="-1"><svg class="icon" aria-hidden="true"><use href="#i-download"/></svg>Yedek Al (JSON)</button>
            <div class="menu-separator" role="separator"></div>
            <button type="button" role="menuitem" id="btn-import-json" class="menu-item" tabindex="-1"><svg class="icon" aria-hidden="true"><use href="#i-upload"/></svg>Yedekten Yükle</button>
          </div>
        </div>
        <button type="button" id="btn-settings" class="btn btn-ghost" title="Ayarlar"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg><span class="btn-label">Ayarlar</span></button>
        <input type="file" id="file-import" accept=".json,application/json" hidden>
      </div>
    </div>
  </header>

  <main>
    <p id="cloud-error" class="cloud-error" role="alert" hidden></p>
    <section class="toolbar" aria-label="Filtreler">
      <div class="toolbar-filters">
        <div class="search-field">
          <svg class="icon search-icon" aria-hidden="true"><use href="#i-search"/></svg>
          <input type="search" id="search" class="input" placeholder="Görev ara…" aria-label="Görev ara" autocomplete="off">
        </div>
        <label class="filter-control"><span class="filter-label">Alan</span><select id="filter-alan" data-filter="alan"></select></label>
        <label class="filter-control"><span class="filter-label">Sahip</span><select id="filter-sahip" data-filter="sahip"></select></label>
        <label class="filter-control"><span class="filter-label">Durum</span><select id="filter-durum" data-filter="durum"></select></label>
        <label class="switch"><input type="checkbox" id="show-completed"><span class="switch-track" aria-hidden="true"></span><span>Tamamlananları göster</span></label>
        <button type="button" id="btn-clear-filters" class="btn btn-link" hidden><svg class="icon icon-sm" aria-hidden="true"><use href="#i-x"/></svg>Filtreleri temizle</button>
      </div>
      <button type="button" id="btn-add" class="btn btn-primary"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>Yeni Görev</button>
    </section>

    <section class="summary-bar" aria-label="Özet">
      <div id="summary" class="summary"></div>
    </section>

    <div id="list-view" class="table-wrap">
      <table id="task-table">
        <thead>
          <tr>
            <th data-sort="alan" class="col-alan" aria-sort="none"><button type="button" class="th-sort">Alan<svg class="icon icon-sm sort-icon" aria-hidden="true"><use href="#i-sort"/></svg></button></th>
            <th data-sort="gorev" class="col-gorev" aria-sort="none"><button type="button" class="th-sort">Görev<svg class="icon icon-sm sort-icon" aria-hidden="true"><use href="#i-sort"/></svg></button></th>
            <th data-sort="sahip" class="col-sahip" aria-sort="none"><button type="button" class="th-sort">Sahip<svg class="icon icon-sm sort-icon" aria-hidden="true"><use href="#i-sort"/></svg></button></th>
            <th data-sort="durum" class="col-durum" aria-sort="none"><button type="button" class="th-sort">Durum<svg class="icon icon-sm sort-icon" aria-hidden="true"><use href="#i-sort"/></svg></button></th>
            <th data-sort="tamamlanmaTarihi" class="col-tarih" aria-sort="none"><button type="button" class="th-sort">Tamamlanma Tarihi<svg class="icon icon-sm sort-icon" aria-hidden="true"><use href="#i-sort"/></svg></button></th>
            <th data-sort="tamamlanmaTarihi" class="col-kalan"><button type="button" class="th-sort" title="Tamamlanma tarihine göre sırala">Kalan</button></th>
            <th class="col-actions"><span class="sr-only">İşlemler</span></th>
          </tr>
        </thead>
        <tbody id="task-body"></tbody>
      </table>
      <div id="loading-state" class="loading-state" aria-label="Görevler yükleniyor" hidden></div>
      <div id="empty-state" class="empty-state" hidden></div>
    </div>

    <div id="board-view" class="board" hidden></div>
  </main>

  <footer class="app-footer">
    <span id="storage-note">Veriler yalnızca bu tarayıcıda (localStorage) saklanır. Düzenli olarak <strong>Yedek Al</strong> ile yedekleyin.</span>
    <span id="backup-info"></span>
  </footer>

  <dialog id="settings-dialog">
    <form method="dialog" class="dialog-header">
      <h2>Ayarlar – Liste Değerleri</h2>
      <button class="btn btn-link" value="close" aria-label="Kapat">✕</button>
    </form>
    <p class="hint">Değerleri yeniden adlandırdığınızda mevcut görevler de güncellenir. Görevlerde kullanılan değerler silinemez. "Tamamlandı" durumu sabittir.</p>
    <div id="settings-lists" class="settings-lists"></div>
  </dialog>

  <dialog id="task-dialog">
    <form id="task-form">
      <div class="dialog-header">
        <h2 id="task-dialog-title">Görev</h2>
        <button type="button" class="btn btn-link" data-close aria-label="Kapat">✕</button>
      </div>
      <label class="field">Görev
        <input type="text" name="gorev" required maxlength="255" placeholder="Görev açıklaması…">
      </label>
      <div class="field-grid">
        <label class="field">Alan <select name="alan"></select></label>
        <label class="field">Sahip <select name="sahip"></select></label>
        <label class="field">Durum <select name="durum"></select></label>
        <label class="field">Tamamlanma Tarihi <input type="date" name="tamamlanmaTarihi"></label>
      </div>
      <div class="dialog-actions">
        <button type="button" id="task-delete" class="btn btn-danger">Sil</button>
        <span class="spacer"></span>
        <button type="button" class="btn" data-close>Vazgeç</button>
        <button type="submit" class="btn btn-primary">Kaydet</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="config.js"></script>
  <script src="cloud.js"></script>
  <script src="app.js"></script>
</body>
</html>
